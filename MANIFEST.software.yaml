title: Zettelkasten software environment and repository tools
include_h1: false
vault_path: "C:/Users/fleng/Zettelkasten"

component_sections:
  - key: zettelkasten_software
    heading: Zettelkasten software
    description: Software used directly with the Zettelkasten.
  - key: export_software
    heading: Export software
    description: Software used to export notes and work with LaTeX or PDF output.
  - key: repository_tools
    heading: Repository tools
    description: Software used to maintain this repository and generated Wiki documentation. These tools are not required merely to use the Zettelkasten.

components:
  - name: Obsidian
    section: zettelkasten_software
    role: note editor and slip-box interface
    probe:
      type: file_version
      paths:
        - "%LOCALAPPDATA%/Programs/Obsidian/Obsidian.exe"
        - "%LOCALAPPDATA%/Obsidian/Obsidian.exe"

  - name: Zotero
    section: zettelkasten_software
    role: reference manager
    probe:
      type: file_version
      paths:
        - "%PROGRAMFILES%/Zotero/zotero.exe"
        - "%LOCALAPPDATA%/Programs/Zotero/zotero.exe"
        - "%LOCALAPPDATA%/Zotero/zotero.exe"

  - name: Better BibTeX
    section: zettelkasten_software
    role: Zotero add-on for stable citation keys and bibliography export
    version: manual
    probe:
      type: manual

  - name: Pandoc
    section: export_software
    role: Markdown export and citation processing
    probe:
      type: command
      command: ["pandoc", "--version"]

  - name: MiKTeX
    section: export_software
    role: LaTeX distribution for PDF export
    probe:
      type: command
      command: ["miktex", "--version"]

  - name: WinEdt 11
    section: export_software
    role: LaTeX editor used with exported LaTeX or PDF output
    probe:
      type: file_version
      paths:
        - "%USERPROFILE%/WinEdt Team/WinEdt 11/WinEdt.exe"
        - "%USERPROFILE%/WinEdt Team/WinEdt 11/winedt.exe"
        - "C:/Users/fleng/WinEdt Team/WinEdt 11/WinEdt.exe"
        - "C:/Users/fleng/WinEdt Team/WinEdt 11/winedt.exe"
        - "%PROGRAMFILES%/WinEdt Team/WinEdt 11/WinEdt.exe"
        - "%PROGRAMFILES%/WinEdt Team/WinEdt 11/winedt.exe"
        - "%PROGRAMFILES(X86)%/WinEdt Team/WinEdt 11/WinEdt.exe"
        - "%PROGRAMFILES(X86)%/WinEdt Team/WinEdt 11/winedt.exe"

  - name: Python
    section: repository_tools
    role: repository tooling
    probe:
      type: command
      command: ["py", "--version"]

  - name: Git
    section: repository_tools
    role: repository and Wiki updates
    probe:
      type: command
      command: ["git", "--version"]

  - name: Visual Studio Code
    section: repository_tools
    role: editing repository scripts, templates, and Markdown files
    probe:
      type: file_version
      paths:
        - "%LOCALAPPDATA%/Programs/Microsoft VS Code/Code.exe"
        - "%USERPROFILE%/AppData/Local/Programs/Microsoft VS Code/Code.exe"
        - "%PROGRAMFILES%/Microsoft VS Code/Code.exe"
        - "%PROGRAMFILES(X86)%/Microsoft VS Code/Code.exe"

obsidian_plugins: true

sync_and_replication:
  - name: Syncthing
    host: Raspberry Pi
    role: always-on replication endpoint for the Zettelkasten vault; functions like a NAS
    version: manual
    probe:
      type: manual

  - name: SyncTrayzor
    host: Windows workstation
    role: Windows tray interface used to monitor or manage synchronization
    version: manual
    probe:
      type: manual

repository_file_sections:
  - key: repository_support
    heading: Repository support files
    description: Files that support note creation, validation, export, or repository documentation.
  - key: local_diagnostics
    heading: Local diagnostics
    description: Local scripts for inspecting the vault. These may contain local paths and are not portable tools.

repository_files:
  - path: templates/NewFileTemplate.md
    category: repository_support
    role: Obsidian Templater template for creating a new Zettel

  - path: templates/WikilinkTitle.md
    category: repository_support
    role: Obsidian Templater template for appending note titles to WikiLinks

  - path: python/zettel_validate.py
    category: repository_support
    role: validates completed Markdown Zettels

  - path: python/README-validator.md
    category: repository_support
    role: validator usage notes

  - path: python/test_zettel_validate.py
    category: repository_support
    role: validator unit tests

  - path: python/gen_software_components.py
    category: repository_support
    role: generates the software environment Wiki page from MANIFEST.software.yaml

  - path: Makefile
    category: repository_support
    role: optional GNU Make automation for generating and publishing the software environment Wiki page

  - path: scripts/publish-software-environment.ps1
    category: repository_support
    role: PowerShell automation for generating, copying, committing, and pushing the generated software environment Wiki page

  - path: scripts/publish-software-environment.cmd
    category: repository_support
    role: Windows command wrapper for the software environment Wiki publishing script

  - path: pandoc/template.tex
    category: repository_support
    role: modified Pandoc LaTeX template

  - path: LaTeX/LatexColors.incl.sty
    category: repository_support
    role: LaTeX color style file

  - path: scripts/create-index-notes.bat
    category: repository_support
    role: creates missing reserved alphanumeric index notes for a new Zettelkasten

  - path: python/zk_validation_stats.py
    category: local_diagnostics
    role: local validation/statistics script

  - path: python/word_count_histogram.py
    category: local_diagnostics
    role: local word-count histogram script
